[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ylinux-code-audit-agent"
version = "1.0.0"
description = "Tool-calling application-security audit agent for the ylinux_old codebase."
requires-python = ">=3.10"
dependencies = ["openai==2.32.0"]

[project.optional-dependencies]
dev = ["pytest==9.0.3"]

[project.scripts]
audit-agent = "audit_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
